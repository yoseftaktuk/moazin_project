version: '3'
services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_MESSAGE_MAX_BYTES: 31457280
      KAFKA_REPLICA_FETCH_MAX_BYTES: 31457280
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 10  

    volumes:
      - kafka_kraft:/var/lib/kafka/data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl --silent -f http://localhost:9200/_cluster/health?wait_for_status=green&timeout=1s || exit 1"
      ]  
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s 
  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  mongo:
    image: mongo:latest
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db  
    environment: 
      MONGO_INITDB_ROOT_USERNAME: my_db
      MONGO_INITDB_ROOT_PASSWORD: my_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s   
    
  data_manneger:
    build: /data_manneger
    environment:
      KAFKA_URI: kafka:9092
      ELASTIC_URI: http://elasticsearch:9200
    volumes:
       - ./data/podcasts:/app/data  
    depends_on: 
        kafka:
          condition: service_healthy   
  processing_service:
    build: /processing_service
    environment:
        KAFKA_URI: kafka:9092
        ELASTIC_URI: http://elasticsearch:9200
        HOST: mongo
        PORT: 27017
        USER: my_db
        PASSWORD: my_password
    volumes:
      - ./data/podcasts:/app/data    
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy   

  transcription_service:
    build: /Transcription_service
    environment:
        KAFKA_URI: kafka:9092
        ELASTIC_URI: http://elasticsearch:9200
    volumes:
      - ./data/podcasts:/app/data  
    depends_on:
      kafka:
        condition: service_healthy            
      elasticsearch:
        condition: service_healthy  

volumes:
  es_data:
  .:
  kafka_kraft:
  mongodb_data: